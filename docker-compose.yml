version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: org_portal_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: org_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: org_portal_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/org_portal
      - SECRET_KEY=org-portal-super-secret-production-key-change-in-prod-9874523
      - STORAGE_PROVIDER=local
      - STORAGE_LOCAL_DIR=/app/storage_uploads
    ports:
      - "8000:8000"
    volumes:
      - ./Backend/storage_uploads:/app/storage_uploads

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: org_portal_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
