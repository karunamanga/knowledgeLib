services:
  - type: web
    name: knowledgelib-backend
    env: python
    region: oregon
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 50
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: knowledgelib-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: portal-files

  - type: web
    name: knowledgelib-frontend
    env: static
    region: oregon
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: knowledgelib-db
    databaseName: knowledgelib
    user: knowledgelib_user
    region: oregon
    plan: free
